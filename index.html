<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marnbach Teamgenerator</title>

<style>

/* ==================================================
   GRUNDLAGEN
   ================================================== */

* { box-sizing: border-box; }

.app {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
}

:root {
  --bg: #f2f2f2;
  --card: #ffffff;
  --text: #111111;
  --muted: #666666;
  --soft: #eeeeee;
  --player: #f0f0f0;
  --border: #d6d6d6;

  --blue: #2673e8;
  --blue-hover: #1763d7;

  --green: #198754;
  --green-light: #cfe8d5;
  --green-border: #76b88a;

  --danger: #d00000;

  --gold: #d6a21e;
  --gold-light: #f0c75e;
  --gold-dark: #a67b0c;

  --shadow: 0 5px 15px rgba(0,0,0,0.10);
}

/* ==================================================
   GRUNDLEGENDE THEME-FARBEN
   ================================================== */

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

/* ==================================================
   DARKMODE
   ================================================== */

body.darkmode {
  --bg: #0d1522;
  --card: #172234;
  --text: #f2f5f9;
  --muted: #aeb8c6;
  --soft: #223047;
  --player: #202d41;
  --border: #34445c;

  --blue: #347ff0;
  --blue-hover: #4b8ff3;

  --green: #20a968;
  --green-light: #193d31;
  --green-border: #2f8566;

  --danger: #ff5d5d;

  --gold: #d9a72b;
  --gold-light: #efc65a;
  --gold-dark: #a77b0d;

  --shadow: 0 6px 20px rgba(0,0,0,0.28);
}

#themeDunkel {
  background: #223047;
  border-color: #347ff0;
  color: #f2f5f9;
}

#themeDunkel .theme-check { color: #4b8ff3; }

/* ==================================================
   GOLD STYLE
   ================================================== */

body.goldmode {
  --bg: #050607;
  --card: #0c0e10;
  --text: #f4f4f4;
  --muted: #96999f;
  --soft: #121417;
  --player: #101214;
  --border: #282b30;

  --blue: #dcae38;
  --blue-hover: #f0c85d;

  --green: #1e5d3d;
  --green-light: #201b10;
  --green-border: #c89b2e;

  --danger: #ff6666;

  --gold: #dcae38;
  --gold-light: #f2c957;
  --gold-dark: #9c7218;

  --shadow: 0 8px 24px rgba(0,0,0,0.42);
}

body.goldmode {
  background: radial-gradient(circle at top, #17140d 0%, #08090a 35%, #050607 75%);
}

#themeGold {
  background: linear-gradient(135deg, #0b0c0d, #17130a);
  color: #f2f2f2;
}

/* ==================================================
   LEDERHOSEN STYLE
   ================================================== */

body.ledermode {
  --bg: #24170d;
  --card: #d7bd91;
  --text: #352315;
  --muted: #70583c;

  --soft: #cdb083;
  --player: #dfc89f;
  --border: #8b6538;

  --blue: #405b20;
  --blue-hover: #536f2a;

  --green: #405b20;
  --green-light: #8d9d60;
  --green-border: #405b20;

  --danger: #9d2525;

  --gold: #a47a32;
  --gold-light: #e0c17b;
  --gold-dark: #69491e;

  --shadow: 0 5px 12px rgba(35,18,6,0.35);
}

body.ledermode {
  background: linear-gradient(90deg, #1b1008 0%, #33200f 18%, #21140a 50%, #33200f 82%, #1b1008 100%);
  color: var(--text);
}

/* Lederartige Karten */
body.ledermode .card,
body.ledermode .header,
body.ledermode .navigation {
  border: 2px solid #7b5429;
  box-shadow: 0 4px 10px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
}

/* Dezente Nähte */
body.ledermode .card {
  outline: 1px dashed rgba(91,60,27,0.55);
  outline-offset: -6px;
}

/* Header */
body.ledermode .header {
  background: linear-gradient(135deg, #24170d, #4a2e13, #26170c);
  color: #f3e4c4;
  min-height: 120px;
}

body.ledermode .logo {
  color: #f3e4c4;
  text-shadow: 0 2px 3px #120a04;
}

body.ledermode .version { color: #d9b86e; }

/* Navigation */
body.ledermode .navigation { background: #4b3017; }

body.ledermode .nav-button {
  background: #d7bd91;
  color: #382515;
  border: 1px solid #8b6538;
}

body.ledermode .nav-button.active {
  background: #405b20;
  color: #f3e4c4;
  border-color: #273914;
}

/* Buttons */
body.ledermode .main-button {
  background: linear-gradient(180deg, #506c27, #374d1b);
  color: #f5e6c4;
  border: 2px solid #7c6b3b;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 3px 5px rgba(0,0,0,0.25);
}

body.ledermode .main-button:hover {
  background: linear-gradient(180deg, #5d7b2e, #40591f);
}

body.ledermode .save-button {
  background: #405b20;
  color: #f5e6c4;
  border: 2px solid #6f6a39;
}

/* Team-Auswahl */
body.ledermode .team-count button {
  background: #e1cba4;
  color: #382515;
  border: 2px solid #a47a46;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
}

body.ledermode .team-count button.active {
  background: #405b20;
  color: #f5e6c4;
  border-color: #263813;
}

/* Spieler */
body.ledermode .player {
  background: linear-gradient(180deg, #e4cea8, #d4b98a);
  border: 2px solid #a47a46;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
}

body.ledermode .player.selected {
  background: linear-gradient(180deg, #9aa66b, #7d8e4c);
  border-color: #3e521f;
  color: #f8efd9;
}

body.ledermode .player input { accent-color: #405b20; }

/* Torwart */
body.ledermode .goalkeeper-button {
  background: #e1cba4;
  color: #4a321c;
  border: 2px solid #9b7441;
}

body.ledermode .goalkeeper-button.status-t {
  background: #405b20;
  border-color: #304517;
  color: #f5e6c4;
}

body.ledermode .goalkeeper-button.status-tplus {
  background: #8d692c;
  border-color: #604719;
  color: #fff1c7;
}

/* Teamkarten */
body.ledermode .team-card {
  background: #dfc69b;
  border: 2px solid #896036;
}

body.ledermode .team-header {
  background: linear-gradient(180deg, #4e3419, #2c1b0d);
  color: #f3dfb5;
  border-bottom: 2px solid #8f6a3c;
}

body.ledermode .team-player { border-color: #b29366; }

/* Selected Count */
body.ledermode .selected-count {
  background: #e0c89d;
  border: 1px solid #9a7140;
  color: #3c2816;
}

/* Status */
body.ledermode .status.success { color: #405b20; }

/* Spielverlauf */
body.ledermode .history-item {
  border: 2px solid #8b6538;
  background: #d7bd91;
}

body.ledermode .history-header {
  background: #4b3017;
  color: #f3dfb5;
}

body.ledermode .history-team-title {
  background: #405b20;
  color: #f4e8cc;
}

body.ledermode .history-player { border-color: #b29366; }

/* Optionen */
body.ledermode .theme-option {
  background: #e0c89d;
  color: #382515;
  border: 2px solid #9a7140;
}

body.ledermode .theme-option.active {
  background: #8d9d60;
  border-color: #405b20;
}

body.ledermode .theme-check { color: #405b20; }

/* Leder-Theme Auswahl */
#themeLeder {
  background: linear-gradient(135deg, #2a190c, #5a3919);
  color: #f0dfb8;
}

/* ==================================================
   OPTIONEN BUTTON
   ================================================== */

.options-button {
  position: absolute;
  right: 12px;
  top: 12px;
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--soft);
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
}

body.goldmode .options-button {
  border-color: rgba(220,174,56,0.65);
  color: var(--gold-light);
  background: rgba(220,174,56,0.06);
}

body.ledermode .options-button {
  background: #2c1b0d;
  color: #e0bd70;
  border-color: #8b6538;
}

/* ==================================================
   HEADER
   ================================================== */

.header {
  position: relative;
  background: var(--card);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 10px;
  text-align: center;
  box-shadow: var(--shadow);
}

.logo {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  font-size: 30px;
  font-weight: bold;
}

.ball { font-size: 30px; }

.version {
  margin-top: 5px;
  font-size: 16px;
  color: var(--muted);
}

/* ==================================================
   NAVIGATION
   ================================================== */

.navigation {
  display: flex;
  gap: 8px;
  background: var(--card);
  padding: 8px;
  border-radius: 15px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}

.nav-button {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: var(--soft);
  color: var(--text);
}

.nav-button.active {
  background: var(--blue);
  color: white;
}

/* ==================================================
   KARTEN
   ================================================== */

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}

/* ==================================================
   STATUS
   ================================================== */

.status-card { text-align: center; }

.status {
  margin-top: 10px;
  font-size: 14px;
  color: var(--muted);
}

.status.error {
  color: var(--danger);
  font-weight: bold;
}

.status.success {
  color: var(--green);
  font-weight: bold;
}

/* ==================================================
   BUTTONS
   ================================================== */

button { font-family: Arial, sans-serif; }

.main-button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 14px;
  background: var(--blue);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.main-button:hover { background: var(--blue-hover); }

.main-button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.save-button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 14px;
  background: var(--green);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}

.save-button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

/* ==================================================
   TEAM STEUERUNG
   ================================================== */

.team-controls {
  position: sticky;
  top: 8px;
  z-index: 20;
}

.team-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 10px;
}

.team-count {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.team-count button {
  flex: 1;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--soft);
  color: var(--text);
  padding: 13px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.team-count button.active {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}

.selected-count {
  text-align: center;
  background: var(--soft);
  border-radius: 10px;
  padding: 11px;
  margin-top: 10px;
  font-weight: bold;
}

/* ==================================================
   SPIELER
   ================================================== */

.players-card { padding: 12px; }

.players-title {
  font-size: 24px;
  font-weight: bold;
  margin: 5px 0 12px 4px;
}

.players-scroll {
  max-height: 58vh;
  overflow-y: auto;
  padding-right: 3px;
}

.player {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--player);
  border-radius: 11px;
  padding: 10px 12px;
  margin-bottom: 6px;
  min-height: 54px;
  border: 2px solid transparent;
  cursor: pointer;
}

.player.selected {
  background: var(--green-light);
  border-color: var(--green-border);
}

.player input {
  width: 25px;
  height: 25px;
  margin: 0;
  cursor: pointer;
  accent-color: var(--blue);
  flex-shrink: 0;
}

.player-name {
  flex: 1;
  font-size: 17px;
  line-height: 1.2;
}

/* ==================================================
   TORWART
   ================================================== */

.goalkeeper-button {
  width: 58px;
  min-width: 58px;
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 8px 5px;
  background: var(--card);
  color: var(--muted);
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.goalkeeper-button.status-t {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}

.goalkeeper-button.status-tplus {
  background: var(--gold);
  border-color: var(--gold);
  color: white;
}

/* ==================================================
   TEAMS
   ================================================== */

.teams-title {
  font-size: 24px;
  font-weight: bold;
  margin: 5px 0 12px;
}

.team-card {
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 12px;
  background: var(--player);
}

.team-header {
  background: var(--blue);
  color: white;
  text-align: center;
  padding: 12px;
  font-size: 18px;
  font-weight: bold;
}

.team-player {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 16px;
}

.team-player:last-child { border-bottom: none; }

.no-teams {
  color: var(--muted);
  text-align: center;
  padding: 15px 5px;
}

/* ==================================================
   SPEICHERSTATUS
   ================================================== */

.save-info {
  margin-top: 8px;
  text-align: center;
  font-size: 14px;
  color: var(--muted);
}

.save-info.success {
  color: var(--green);
  font-weight: bold;
}

.save-info.error {
  color: var(--danger);
  font-weight: bold;
}

/* ==================================================
   SPIELVERLAUF
   ================================================== */

.history-empty {
  text-align: center;
  color: var(--muted);
  padding: 30px 10px;
}

.history-icon {
  font-size: 42px;
  margin-bottom: 10px;
}

.history-item {
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 10px;
  background: var(--player);
}

.history-header {
  width: 100%;
  border: 0;
  border-radius: 0;
  padding: 14px;
  background: var(--soft);
  color: var(--text);
  font-size: 16px;
  font-weight: bold;
  text-align: left;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.history-arrow {
  font-size: 18px;
  margin-left: 10px;
}

.history-content {
  display: none;
  padding: 12px;
  background: var(--card);
}

.history-item.open .history-content { display: block; }

.history-team { margin-bottom: 12px; }

.history-team:last-child { margin-bottom: 0; }

.history-team-title {
  background: var(--blue);
  color: white;
  border-radius: 9px;
  padding: 9px 12px;
  font-weight: bold;
  margin-bottom: 4px;
}

.history-player {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 15px;
}

.history-player:last-child { border-bottom: 0; }

/* ==================================================
   OPTIONEN
   ================================================== */

.options-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 18px;
}

.options-section { margin-bottom: 18px; }

.options-section-title {
  font-size: 17px;
  font-weight: bold;
  color: var(--muted);
  margin-bottom: 8px;
}

.theme-option {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 8px;
  background: var(--soft);
  color: var(--text);
  cursor: pointer;
  text-align: left;
  font-size: 16px;
}

.theme-option.active {
  border-color: var(--blue);
  background: var(--card);
}

.theme-option-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.theme-icon { font-size: 23px; }

.theme-check {
  font-size: 18px;
  color: var(--blue);
  font-weight: bold;
}

/* ==================================================
   MOBILE
   ================================================== */

@media (max-width: 480px) {

  .app { padding: 7px; }

  .logo { font-size: 27px; }

  .players-scroll { max-height: 56vh; }

  .player-name { font-size: 16px; }

  .goalkeeper-button {
    width: 54px;
    min-width: 54px;
  }

}

</style>
</head>

<body>
<div class="app">

<!-- ================= HEADER ================= -->
<div class="header">
  <button class="options-button" onclick="zeigeOptionen()" aria-label="Optionen">⚙️</button>
  <div class="logo">
    <span class="ball">⚽</span>
    <span>Marnbach</span>
  </div>
  <div class="version">Teamgenerator V0.7.3</div>
</div>

<!-- ================= NAVIGATION ================= -->
<div id="hauptNavigation" class="navigation">
  <button id="navTeams" class="nav-button active" onclick="zeigeSeite('teams')">⚽ Teams</button>
  <button id="navVerlauf" class="nav-button" onclick="zeigeSeite('verlauf')">📜 Spielverlauf</button>
</div>

<!-- ================= TEAMS ================= -->
<div id="seiteTeams">

  <div class="card status-card">
    <button id="spielerAktualisieren" class="main-button" onclick="spielerLaden()">Spieler aktualisieren</button>
    <div id="status" class="status">Bereit</div>
  </div>

  <div class="card team-controls">
    <div class="team-title">Anzahl Teams</div>
    <div class="team-count">
      <button id="team2" class="active" onclick="teamAnzahlWaehlen(2)">2</button>
      <button id="team3" onclick="teamAnzahlWaehlen(3)">3</button>
      <button id="team4" onclick="teamAnzahlWaehlen(4)">4</button>
    </div>
    <button id="teamsErstellen" class="main-button" onclick="teamsErstellen()">Teams erstellen</button>
    <div id="selectedCount" class="selected-count">0 Spieler dabei</div>
  </div>

  <div class="card players-card">
    <div class="players-title">Spieler</div>
    <div id="players" class="players-scroll">
      <div class="no-teams">Bitte zuerst Spieler aktualisieren.</div>
    </div>
  </div>

  <div class="card">
    <div class="teams-title">Teams</div>
    <div id="teamsErgebnis">
      <div class="no-teams">Noch keine Teams erstellt.</div>
    </div>
    <button id="teamsSpeichern" class="save-button" onclick="teamsSpeichern()" style="display:none">💾 Teams speichern</button>
    <div id="saveInfo" class="save-info"></div>
  </div>

</div>

<!-- ================= SPIELVERLAUF ================= -->
<div id="seiteVerlauf" style="display:none">
  <div class="card">
    <div class="teams-title">Spielverlauf</div>
    <div id="spielverlauf">
      <div class="history-empty">
        <div class="history-icon">📜</div>
        <div>Spielverlauf wird geladen...</div>
      </div>
    </div>
  </div>
</div>

<!-- ================= OPTIONEN ================= -->
<div id="seiteOptionen" style="display:none">
  <div class="card">
    <div class="options-title">
      <span>⚙️</span>
      <span>Optionen</span>
    </div>

    <div class="options-section">
      <div class="options-section-title">Darstellung</div>

      <button id="themeHell" class="theme-option" onclick="themeSetzen('hell')">
        <span class="theme-option-left">
          <span class="theme-icon">☀️</span>
          <span>Hell</span>
        </span>
        <span id="checkHell" class="theme-check"></span>
      </button>

      <button id="themeDunkel" class="theme-option" onclick="themeSetzen('dunkel')">
        <span class="theme-option-left">
          <span class="theme-icon">🌙</span>
          <span>Dunkel</span>
        </span>
        <span id="checkDunkel" class="theme-check"></span>
      </button>

      <button id="themeGold" class="theme-option" onclick="themeSetzen('gold')">
        <span class="theme-option-left">
          <span class="theme-icon">🥇</span>
          <span>Gold</span>
        </span>
        <span id="checkGold" class="theme-check"></span>
      </button>

      <button id="themeLeder" class="theme-option" onclick="themeSetzen('leder')">
        <span class="theme-option-left">
          <span class="theme-icon">🥨</span>
          <span>Lederhosen</span>
        </span>
        <span id="checkLeder" class="theme-check"></span>
      </button>
    </div>

    <button class="main-button" onclick="optionenZurueck()">← Zurück</button>
  </div>
</div>

</div>

<script>

/* ==================================================
   MASTER
   ================================================== */

const MASTER_URL = "https://script.google.com/macros/s/AKfycbyRxZCIWtFM1P7fO4DPqG9McQF1WrNQn5jtbDShDU4x4Mz1afHa7jRMq-oG3jz5qX8/exec";

let spieler = [];
let anzahlTeams = 2;
let aktuelleTeams = null;

/* ==================================================
   THEME STARTEN
   ================================================== */

document.addEventListener("DOMContentLoaded", function () {
  const theme = localStorage.getItem("marnbach-theme");

  if (theme === "dunkel") {
    document.body.classList.add("darkmode");
  } else if (theme === "gold") {
    document.body.classList.add("goldmode");
  } else if (theme === "leder") {
    document.body.classList.add("ledermode");
  }

  themeAnzeigeAktualisieren();
});

/* ==================================================
   OPTIONEN
   ================================================== */

function zeigeOptionen() {
  document.getElementById("hauptNavigation").style.display = "none";
  document.getElementById("seiteTeams").style.display = "none";
  document.getElementById("seiteVerlauf").style.display = "none";
  document.getElementById("seiteOptionen").style.display = "block";

  themeAnzeigeAktualisieren();
}

function optionenZurueck() {
  document.getElementById("seiteOptionen").style.display = "none";
  document.getElementById("hauptNavigation").style.display = "flex";

  zeigeSeite("teams");
}

/* ==================================================
   THEME SETZEN
   ================================================== */

function themeSetzen(theme) {
  document.body.classList.remove("darkmode", "goldmode", "ledermode");

  if (theme === "dunkel") {
    document.body.classList.add("darkmode");
    localStorage.setItem("marnbach-theme", "dunkel");
  } else if (theme === "gold") {
    document.body.classList.add("goldmode");
    localStorage.setItem("marnbach-theme", "gold");
  } else if (theme === "leder") {
    document.body.classList.add("ledermode");
    localStorage.setItem("marnbach-theme", "leder");
  } else {
    localStorage.setItem("marnbach-theme", "hell");
  }

  themeAnzeigeAktualisieren();
}

/* ==================================================
   THEME ANZEIGE
   ================================================== */

function themeAnzeigeAktualisieren() {
  const dunkel = document.body.classList.contains("darkmode");
  const gold = document.body.classList.contains("goldmode");
  const leder = document.body.classList.contains("ledermode");
  const hell = !dunkel && !gold && !leder;

  const buttons = {
    hell: document.getElementById("themeHell"),
    dunkel: document.getElementById("themeDunkel"),
    gold: document.getElementById("themeGold"),
    leder: document.getElementById("themeLeder")
  };

  const checks = {
    hell: document.getElementById("checkHell"),
    dunkel: document.getElementById("checkDunkel"),
    gold: document.getElementById("checkGold"),
    leder: document.getElementById("checkLeder")
  };

  const aktiv = { hell, dunkel, gold, leder };

  Object.keys(buttons).forEach(function (key) {
    if (buttons[key]) {
      buttons[key].classList.toggle("active", aktiv[key]);
    }
    if (checks[key]) {
      checks[key].textContent = aktiv[key] ? "✓" : "";
    }
  });
}

/* ==================================================
   NAVIGATION
   ================================================== */

function zeigeSeite(seite) {
  const teamsSeite = document.getElementById("seiteTeams");
  const verlaufSeite = document.getElementById("seiteVerlauf");
  const optionenSeite = document.getElementById("seiteOptionen");
  const navTeams = document.getElementById("navTeams");
  const navVerlauf = document.getElementById("navVerlauf");

  optionenSeite.style.display = "none";

  if (seite === "teams") {
    teamsSeite.style.display = "block";
    verlaufSeite.style.display = "none";
    navTeams.classList.add("active");
    navVerlauf.classList.remove("active");
  } else {
    teamsSeite.style.display = "none";
    verlaufSeite.style.display = "block";
    navTeams.classList.remove("active");
    navVerlauf.classList.add("active");

    spielverlaufLaden();
  }
}

/* ==================================================
   SPIELER LADEN
   ================================================== */

function spielerLaden() {
  const status = document.getElementById("status");

  status.className = "status";
  status.textContent = "Spieler werden geladen...";

  const alterScript = document.getElementById("spielerScript");
  if (alterScript) {
    alterScript.remove();
  }

  window.marnbachSpielerCallback = function (daten) {
    try {
      if (!daten || !daten.success) {
        throw new Error(daten && daten.error ? daten.error : "Ungültige Antwort vom Master.");
      }

      spieler = Array.isArray(daten.spieler) ? daten.spieler : [];
      spielerAnzeigen();

      status.className = "status success";
      status.textContent = spieler.length + " Spieler geladen.";
    } catch (err) {
      status.className = "status error";
      status.textContent = "Fehler beim Laden der Spieler.";
      console.error(err);
    }
  };

  const script = document.createElement("script");
  script.id = "spielerScript";
  script.src = MASTER_URL + "?action=spielerPWA";
  script.onerror = function () {
    status.className = "status error";
    status.textContent = "Verbindung zur Master-Datei fehlgeschlagen.";
  };

  document.body.appendChild(script);
}

/* ==================================================
   SPIELER ANZEIGEN
   ================================================== */

function spielerAnzeigen() {
  const container = document.getElementById("players");
  container.innerHTML = "";

  if (!spieler.length) {
    container.innerHTML = `<div class="no-teams">Keine Spieler vorhanden.</div>`;
    return;
  }

  spieler.forEach(function (s) {
    const name = (String(s.vorname || "").trim() + " " + String(s.nachname || "").trim()).trim();

    const zeile = document.createElement("div");
    zeile.className = "player";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "spieler-checkbox";
    checkbox.dataset.id = s.id;

    checkbox.addEventListener("change", function () {
      zeile.classList.toggle("selected", checkbox.checked);
      spielerZaehlen();
    });

    const text = document.createElement("span");
    text.className = "player-name";
    text.textContent = name;

    const torwartButton = document.createElement("button");
    torwartButton.type = "button";
    torwartButton.className = "goalkeeper-button";
    torwartButton.dataset.status = "normal";
    torwartButton.textContent = "—";

    torwartButton.addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();

      const aktuellerStatus = torwartButton.dataset.status;
      let neuerStatus;

      if (aktuellerStatus === "normal") {
        neuerStatus = "T";
      } else if (aktuellerStatus === "T") {
        neuerStatus = "T+";
      } else {
        neuerStatus = "normal";
      }

      torwartButton.dataset.status = neuerStatus;
      torwartButton.classList.remove("status-t", "status-tplus");

      if (neuerStatus === "T") {
        torwartButton.textContent = "T";
        torwartButton.classList.add("status-t");
      } else if (neuerStatus === "T+") {
        torwartButton.textContent = "T+";
        torwartButton.classList.add("status-tplus");
      } else {
        torwartButton.textContent = "—";
      }
    });

    zeile.addEventListener("click", function () {
      checkbox.checked = !checkbox.checked;
      zeile.classList.toggle("selected", checkbox.checked);
      spielerZaehlen();
    });

    zeile.appendChild(checkbox);
    zeile.appendChild(text);
    zeile.appendChild(torwartButton);

    container.appendChild(zeile);
  });

  spielerZaehlen();
}

/* ==================================================
   SPIELER ZÄHLEN
   ================================================== */

function spielerZaehlen() {
  const anzahl = document.querySelectorAll(".spieler-checkbox:checked").length;
  document.getElementById("selectedCount").textContent = anzahl + " Spieler dabei";
}

/* ==================================================
   ANZAHL TEAMS
   ================================================== */

function teamAnzahlWaehlen(anzahl) {
  anzahlTeams = anzahl;

  document.querySelectorAll(".team-count button").forEach(function (button) {
    button.classList.remove("active");
  });

  document.getElementById("team" + anzahl).classList.add("active");
}

/* ==================================================
   TEAMS ERSTELLEN
   ================================================== */

function teamsErstellen() {
  const checked = Array.from(document.querySelectorAll(".spieler-checkbox:checked"));

  if (checked.length < anzahlTeams) {
    alert("Es müssen mindestens so viele Spieler wie Teams ausgewählt sein.");
    return;
  }

  const ids = checked.map(function (checkbox) {
    return checkbox.dataset.id;
  });

  const notizen = {};

  checked.forEach(function (checkbox) {
    const zeile = checkbox.closest(".player");
    const torwartButton = zeile.querySelector(".goalkeeper-button");
    if (!torwartButton) return;

    const status = torwartButton.dataset.status;
    if (status === "T" || status === "T+") {
      notizen[String(checkbox.dataset.id)] = status;
    }
  });

  const button = document.getElementById("teamsErstellen");
  const ergebnis = document.getElementById("teamsErgebnis");
  const saveButton = document.getElementById("teamsSpeichern");
  const saveInfo = document.getElementById("saveInfo");

  saveButton.style.display = "none";
  saveButton.disabled = false;
  saveButton.textContent = "💾 Teams speichern";

  saveInfo.textContent = "";
  saveInfo.className = "save-info";

  button.disabled = true;
  button.textContent = "Teams werden erstellt...";

  ergebnis.innerHTML = `<div class="no-teams">Teams werden erstellt...</div>`;

  const callbackName = "marnbachTeamsCallback_" + Date.now();

  window[callbackName] = function (daten) {
    try {
      if (!daten || !daten.success) {
        throw new Error(daten && daten.error ? daten.error : "Der Master konnte keine Teams erstellen.");
      }

      aktuelleTeams = daten.teams;
      teamsAnzeigen(daten.teams);

      saveButton.style.display = "block";
      saveButton.disabled = false;
      saveButton.textContent = "💾 Teams speichern";
    } catch (err) {
      ergebnis.innerHTML = `<div class="no-teams" style="color:var(--danger);">${escapeHtml(err.message)}</div>`;
    } finally {
      button.disabled = false;
      button.textContent = "Teams erstellen";
      cleanup();
    }
  };

  const params = new URLSearchParams();
  params.set("action", "teams");
  params.set("ids", JSON.stringify(ids));
  params.set("anzahlTeams", String(anzahlTeams));
  params.set("notizen", JSON.stringify(notizen));
  params.set("prefix", callbackName);

  const script = document.createElement("script");
  script.id = callbackName;
  script.src = MASTER_URL + "?" + params.toString();
  script.onerror = function () {
    ergebnis.innerHTML = `<div class="no-teams" style="color:var(--danger);">Verbindung zur Master-Datei fehlgeschlagen.</div>`;

    button.disabled = false;
    button.textContent = "Teams erstellen";
    cleanup();
  };

  document.body.appendChild(script);

  function cleanup() {
    try {
      delete window[callbackName];
    } catch (e) {}

    const element = document.getElementById(callbackName);
    if (element) element.remove();
  }
}

/* ==================================================
   TEAMS ANZEIGEN
   ================================================== */

function teamsAnzeigen(teams) {
  const container = document.getElementById("teamsErgebnis");
  container.innerHTML = "";

  if (!teams) {
    container.innerHTML = `<div class="no-teams">Keine Teams zurückgegeben.</div>`;
    return;
  }

  ["A", "B", "C", "D"].forEach(function (buchstabe) {
    const spielerImTeam = Array.isArray(teams[buchstabe]) ? teams[buchstabe] : [];
    if (!spielerImTeam.length) return;

    const teamCard = document.createElement("div");
    teamCard.className = "team-card";

    const header = document.createElement("div");
    header.className = "team-header";
    header.textContent = "Team " + buchstabe;

    teamCard.appendChild(header);

    spielerImTeam.forEach(function (name) {
      const player = document.createElement("div");
      player.className = "team-player";
      player.textContent = name;

      teamCard.appendChild(player);
    });

    container.appendChild(teamCard);
  });
}

/* ==================================================
   TEAMS SPEICHERN
   ================================================== */

function teamsSpeichern() {
  if (!aktuelleTeams) {
    alert("Bitte zuerst Teams erstellen.");
    return;
  }

  const button = document.getElementById("teamsSpeichern");
  const info = document.getElementById("saveInfo");

  button.disabled = true;
  button.textContent = "Teams werden gespeichert...";

  info.className = "save-info";
  info.textContent = "Verbindung zum Master wird hergestellt...";

  const callbackName = "marnbachSpeichernCallback_" + Date.now();
  let abgeschlossen = false;

  window[callbackName] = function (daten) {
    abgeschlossen = true;

    try {
      if (!daten || !daten.success) {
        throw new Error(daten && daten.error ? daten.error : "Die Teams konnten nicht gespeichert werden.");
      }

      info.className = "save-info success";
      info.textContent = "✓ Teams erfolgreich gespeichert.";

      button.disabled = true;
      button.textContent = "✓ Teams gespeichert";
    } catch (err) {
      info.className = "save-info error";
      info.textContent = "Fehler: " + err.message;

      button.disabled = false;
      button.textContent = "💾 Teams speichern";
    } finally {
      cleanup();
    }
  };

  const params = new URLSearchParams();
  params.set("action", "teamsSpeichernPWA");
  params.set("teams", JSON.stringify(aktuelleTeams));
  params.set("prefix", callbackName);

  const script = document.createElement("script");
  script.id = callbackName;
  script.src = MASTER_URL + "?" + params.toString();
  script.onerror = function () {
    if (abgeschlossen) return;

    info.className = "save-info error";
    info.textContent = "Verbindung zur Master-Datei fehlgeschlagen.";

    button.disabled = false;
    button.textContent = "💾 Teams speichern";
    cleanup();
  };

  document.body.appendChild(script);

  setTimeout(function () {
    if (abgeschlossen) return;

    info.className = "save-info error";
    info.textContent = "Keine Antwort vom Master erhalten.";

    button.disabled = false;
    button.textContent = "💾 Teams speichern";
    cleanup();
  }, 15000);

  function cleanup() {
    try {
      delete window[callbackName];
    } catch (e) {}

    const element = document.getElementById(callbackName);
    if (element) element.remove();
  }
}

/* ==================================================
   SPIELVERLAUF LADEN
   ================================================== */

function spielverlaufLaden() {
  const container = document.getElementById("spielverlauf");

  container.innerHTML = `
    <div class="history-empty">
      <div class="history-icon">📜</div>
      <div>Spielverlauf wird geladen...</div>
    </div>
  `;

  const callbackName = "marnbachVerlaufCallback_" + Date.now();

  window[callbackName] = function (daten) {
    try {
      if (!daten || !daten.success) {
        throw new Error(daten && daten.error ? daten.error : "Der Spielverlauf konnte nicht geladen werden.");
      }

      spielverlaufAnzeigen(daten.spiele);
    } catch (err) {
      container.innerHTML = `<div class="history-empty" style="color:var(--danger);">Fehler beim Laden des Spielverlaufs.</div>`;
      console.error(err);
    } finally {
      cleanup();
    }
  };

  const script = document.createElement("script");
  script.id = callbackName;
  script.src = MASTER_URL + "?action=spielverlaufpwa&prefix=" + encodeURIComponent(callbackName);
  script.onerror = function () {
    container.innerHTML = `<div class="history-empty" style="color:var(--danger);">Verbindung zur Master-Datei fehlgeschlagen.</div>`;
    cleanup();
  };

  document.body.appendChild(script);

  function cleanup() {
    try {
      delete window[callbackName];
    } catch (e) {}

    const element = document.getElementById(callbackName);
    if (element) element.remove();
  }
}

/* ==================================================
   SPIELVERLAUF ANZEIGEN
   ================================================== */

function spielverlaufAnzeigen(spiele) {
  const container = document.getElementById("spielverlauf");
  container.innerHTML = "";

  if (!Array.isArray(spiele) || !spiele.length) {
    container.innerHTML = `
      <div class="history-empty">
        <div class="history-icon">📜</div>
        <div>Noch keine gespeicherten Spiele.</div>
      </div>
    `;
    return;
  }

  spiele.forEach(function (spiel) {
    const item = document.createElement("div");
    item.className = "history-item";

    const header = document.createElement("button");
    header.className = "history-header";

    const title = document.createElement("span");
    title.textContent = "⚽ " + String(spiel.datum || "") + " · " + String(spiel.uhrzeit || "");

    const arrow = document.createElement("span");
    arrow.className = "history-arrow";
    arrow.textContent = "▶";

    header.append(title, arrow);

    const content = document.createElement("div");
    content.className = "history-content";

    ["A", "B", "C", "D"].forEach(function (team) {
      const arr = spiel && spiel.teams && Array.isArray(spiel.teams[team]) ? spiel.teams[team] : [];
      if (!arr.length) return;

      const area = document.createElement("div");
      area.className = "history-team";

      const teamTitle = document.createElement("div");
      teamTitle.className = "history-team-title";
      teamTitle.textContent = "Team " + team;

      area.appendChild(teamTitle);

      arr.forEach(function (name) {
        const row = document.createElement("div");
        row.className = "history-player";
        row.textContent = name;

        area.appendChild(row);
      });

      content.appendChild(area);
    });

    item.append(header, content);

    header.addEventListener("click", function () {
      document.querySelectorAll(".history-item.open").forEach(function (anderes) {
        if (anderes !== item) {
          anderes.classList.remove("open");
          const andererPfeil = anderes.querySelector(".history-arrow");
          if (andererPfeil) andererPfeil.textContent = "▶";
        }
      });

      const offen = item.classList.toggle("open");
      arrow.textContent = offen ? "▼" : "▶";
    });

    container.appendChild(item);
  });
}

/* ==================================================
   HTML SICHER DARSTELLEN
   ================================================== */

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

</script>
