<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Marnbach Teamgenerator</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background: #f2f2f2;

      color: #111;

    }


    .app {

      width: 100%;

      max-width: 600px;

      margin: 0 auto;

      padding: 10px;

    }


    /* ==================================================
       HEADER
       ================================================== */

    .header {

      background: white;

      border-radius: 18px;

      padding: 18px;

      margin-bottom: 10px;

      text-align: center;

      box-shadow:
        0 5px 15px rgba(0,0,0,0.10);

    }


    .logo {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      font-size: 30px;

      font-weight: bold;

    }


    .ball {

      font-size: 30px;

    }


    .version {

      margin-top: 5px;

      font-size: 16px;

      color: #666;

    }


    /* ==================================================
       NAVIGATION
       ================================================== */

    .navigation {

      display: flex;

      gap: 8px;

      background: white;

      padding: 8px;

      border-radius: 15px;

      margin-bottom: 10px;

      box-shadow:
        0 5px 15px rgba(0,0,0,0.08);

    }


    .nav-button {

      flex: 1;

      border: none;

      border-radius: 10px;

      padding: 12px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      background: #eeeeee;

      color: #111;

    }


    .nav-button.active {

      background: #2673e8;

      color: white;

    }


    /* ==================================================
       ALLGEMEINE KARTEN
       ================================================== */

    .card {

      background: white;

      border-radius: 18px;

      padding: 16px;

      margin-bottom: 10px;

      box-shadow:
        0 5px 15px rgba(0,0,0,0.10);

    }


    /* ==================================================
       STATUS
       ================================================== */

    .status-card {

      text-align: center;

    }


    .status {

      margin-top: 10px;

      font-size: 14px;

      color: #555;

    }


    .status.error {

      color: #d00000;

      font-weight: bold;

    }


    .status.success {

      color: #008a42;

      font-weight: bold;

    }


    /* ==================================================
       BUTTONS
       ================================================== */

    button {

      font-family:
        Arial,
        sans-serif;

    }


    .main-button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 14px;

      background: #2673e8;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    .main-button:hover {

      background: #1763d7;

    }


    .main-button:disabled {

      background: #9dbbe9;

      cursor: not-allowed;

    }


    .save-button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 14px;

      background: #198754;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 12px;

    }


    .save-button:hover {

      background: #147345;

    }


    /* ==================================================
       TEAM AUSWAHL
       ================================================== */

    .team-controls {

      position: sticky;

      top: 8px;

      z-index: 20;

    }


    .team-title {

      font-size: 22px;

      font-weight: bold;

      margin-bottom: 10px;

    }


    .team-count {

      display: flex;

      gap: 8px;

      margin-bottom: 10px;

    }


    .team-count button {

      flex: 1;

      border: 2px solid #ddd;

      border-radius: 10px;

      background: #f4f4f4;

      padding: 13px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    .team-count button.active {

      background: #2673e8;

      color: white;

      border-color: #2673e8;

    }


    .selected-count {

      text-align: center;

      background: #eeeeee;

      border-radius: 10px;

      padding: 11px;

      margin-top: 10px;

      font-weight: bold;

    }


    /* ==================================================
       SPIELERBEREICH
       ================================================== */

    .players-card {

      padding: 12px;

    }


    .players-title {

      font-size: 24px;

      font-weight: bold;

      margin: 5px 0 12px 4px;

    }


    .players-scroll {

      max-height: 58vh;

      overflow-y: auto;

      padding-right: 3px;

    }


    .player {

      display: flex;

      align-items: center;

      gap: 14px;

      background: #f0f0f0;

      border-radius: 11px;

      padding: 10px 12px;

      margin-bottom: 6px;

      min-height: 54px;

      cursor: pointer;

      transition:
        background 0.15s,
        border 0.15s;

      border: 2px solid transparent;

    }


    .player.selected {

      background: #cfe8d5;

      border-color: #76b88a;

    }


    .player input {

      width: 25px;

      height: 25px;

      margin: 0;

      cursor: pointer;

      accent-color: #2673e8;

      flex-shrink: 0;

    }


    .player-name {

      font-size: 17px;

      line-height: 1.2;

    }


    /* ==================================================
       TEAMS
       ================================================== */

    .teams-title {

      font-size: 24px;

      font-weight: bold;

      margin: 5px 0 12px 0;

    }


    .team-card {

      border: 1px solid #d6d6d6;

      border-radius: 14px;

      overflow: hidden;

      margin-bottom: 12px;

      background: #f7f7f7;

    }


    .team-header {

      background: #2673e8;

      color: white;

      text-align: center;

      padding: 12px;

      font-size: 18px;

      font-weight: bold;

    }


    .team-player {

      padding: 9px 14px;

      border-bottom: 1px solid #ddd;

      font-size: 16px;

    }


    .team-player:last-child {

      border-bottom: none;

    }


    .no-teams {

      color: #555;

      text-align: center;

      padding: 15px 5px;

    }


    /* ==================================================
       SPEICHERSTATUS
       ================================================== */

    .save-info {

      margin-top: 8px;

      text-align: center;

      font-size: 14px;

      color: #666;

    }


    /* ==================================================
       VERLAUF
       ================================================== */

    .history-empty {

      text-align: center;

      color: #555;

      padding: 30px 10px;

    }


    .history-icon {

      font-size: 42px;

      margin-bottom: 10px;

    }


    /* ==================================================
       MOBILE
       ================================================== */

    @media (
      max-width: 480px
    ) {

      .app {

        padding: 7px;

      }


      .logo {

        font-size: 27px;

      }


      .players-scroll {

        max-height: 56vh;

      }


      .player-name {

        font-size: 16px;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- ==================================================
       HEADER
       ================================================== -->

  <div class="header">

    <div class="logo">

      <span class="ball">⚽</span>

      <span>Marnbach</span>

    </div>


    <div class="version">

      Teamgenerator V0.5.9

    </div>

  </div>


  <!-- ==================================================
       NAVIGATION
       ================================================== -->

  <div class="navigation">

    <button
      id="navTeams"
      class="nav-button active"
      onclick="zeigeSeite('teams')"
    >

      ⚽ Teams

    </button>


    <button
      id="navVerlauf"
      class="nav-button"
      onclick="zeigeSeite('verlauf')"
    >

      📜 Spielverlauf

    </button>

  </div>


  <!-- ==================================================
       SEITE: TEAMS
       ================================================== -->

  <div
    id="seiteTeams"
  >


    <!-- STATUS -->

    <div class="card status-card">

      <button
        id="spielerAktualisieren"
        class="main-button"
        onclick="spielerLaden()"
      >

        Spieler aktualisieren

      </button>


      <div
        id="status"
        class="status"
      >

        Bereit

      </div>

    </div>


    <!-- ==================================================
         TEAM CONTROLS
         ================================================== -->

    <div class="card team-controls">

      <div class="team-title">

        Anzahl Teams

      </div>


      <div class="team-count">

        <button
          id="team2"
          class="active"
          onclick="teamAnzahlWaehlen(2)"
        >

          2

        </button>


        <button
          id="team3"
          onclick="teamAnzahlWaehlen(3)"
        >

          3

        </button>


        <button
          id="team4"
          onclick="teamAnzahlWaehlen(4)"
        >

          4

        </button>

      </div>


      <button
        id="teamsErstellen"
        class="main-button"
        onclick="teamsErstellen()"
      >

        Teams erstellen

      </button>


      <div
        id="selectedCount"
        class="selected-count"
      >

        0 Spieler dabei

      </div>

    </div>


    <!-- ==================================================
         SPIELER
         ================================================== -->

    <div class="card players-card">

      <div class="players-title">

        Spieler

      </div>


      <div
        id="players"
        class="players-scroll"
      >

        <div class="no-teams">

          Bitte zuerst Spieler aktualisieren.

        </div>

      </div>

    </div>


    <!-- ==================================================
         ERGEBNISSE
         ================================================== -->

    <div class="card">

      <div class="teams-title">

        Teams

      </div>


      <div
        id="teamsErgebnis"
      >

        <div class="no-teams">

          Noch keine Teams erstellt.

        </div>

      </div>


      <!-- SPEICHERN -->

      <button
        id="teamsSpeichern"
        class="save-button"
        onclick="teamsSpeichern()"
        style="display:none;"
      >

        Teams speichern

      </button>


      <div
        id="saveInfo"
        class="save-info"
      ></div>

    </div>


  </div>


  <!-- ==================================================
       SEITE: SPIELVERLAUF
       ================================================== -->

  <div
    id="seiteVerlauf"
    style="display:none;"
  >

    <div class="card">

      <div class="teams-title">

        Spielverlauf

      </div>


      <div class="history-empty">

        <div class="history-icon">

          📜

        </div>


        <div>

          Der Spielverlauf wird hier angezeigt.

        </div>


        <div
          style="
            margin-top:8px;
            font-size:14px;
            color:#777;
          "
        >

          Die Speicherfunktion wird im nächsten
          Schritt angebunden.

        </div>

      </div>

    </div>

  </div>


</div>


<script>


  /* ==================================================
     MASTER
     ================================================== */

  const MASTER_URL =
    "https://script.google.com/macros/s/AKfycbyRxZCIWtFM1P7fO4DPqG9McQF1WrNQn5jtbDShDU4x4Mz1afHa7jRMq-oG3jz5qX8/exec";


  let spieler = [];

  let anzahlTeams = 2;

  let aktuelleTeams = null;


  /* ==================================================
     NAVIGATION
     ================================================== */

  function zeigeSeite(
    seite
  ) {


    const teamsSeite =
      document.getElementById(
        "seiteTeams"
      );


    const verlaufSeite =
      document.getElementById(
        "seiteVerlauf"
      );


    const navTeams =
      document.getElementById(
        "navTeams"
      );


    const navVerlauf =
      document.getElementById(
        "navVerlauf"
      );


    if (
      seite === "teams"
    ) {

      teamsSeite.style.display =
        "block";

      verlaufSeite.style.display =
        "none";

      navTeams.classList.add(
        "active"
      );

      navVerlauf.classList.remove(
        "active"
      );

    }


    else {

      teamsSeite.style.display =
        "none";

      verlaufSeite.style.display =
        "block";

      navTeams.classList.remove(
        "active"
      );

      navVerlauf.classList.add(
        "active"
      );

    }

  }


  /* ==================================================
     SPIELER LADEN
     ================================================== */

  function spielerLaden() {


    const status =
      document.getElementById(
        "status"
      );


    status.className =
      "status";


    status.textContent =
      "Spieler werden geladen...";


    const alterScript =
      document.getElementById(
        "spielerScript"
      );


    if (
      alterScript
    ) {

      alterScript.remove();

    }


    window.marnbachSpielerCallback =
      function(
        daten
      ) {

        try {

          if (
            !daten ||
            !daten.success
          ) {

            throw new Error(
              daten &&
              daten.error
                ? daten.error
                : "Ungültige Antwort vom Master."
            );

          }


          spieler =
            Array.isArray(
              daten.spieler
            )
              ? daten.spieler
              : [];


          spielerAnzeigen();


          status.className =
            "status success";


          status.textContent =
            spieler.length +
            " Spieler geladen.";

        }


        catch (
          err
        ) {

          status.className =
            "status error";


          status.textContent =
            "Fehler beim Laden der Spieler.";

          console.error(
            err
          );

        }

      };


    const script =
      document.createElement(
        "script"
      );


    script.id =
      "spielerScript";


    script.src =
      MASTER_URL +
      "?action=spielerPWA";


    script.onerror =
      function() {

        status.className =
          "status error";


        status.textContent =
          "Verbindung zur Master-Datei fehlgeschlagen.";

      };


    document.body.appendChild(
      script
    );

  }


  /* ==================================================
     SPIELER ANZEIGEN
     ================================================== */

  function spielerAnzeigen() {


    const container =
      document.getElementById(
        "players"
      );


    container.innerHTML =
      "";


    if (
      !spieler.length
    ) {

      container.innerHTML =
        `
          <div class="no-teams">
            Keine Spieler vorhanden.
          </div>
        `;

      return;

    }


    spieler.forEach(
      function(
        s
      ) {


        const name =
          (
            String(
              s.vorname ||
              ""
            ).trim() +
            " " +
            String(
              s.nachname ||
              ""
            ).trim()
          ).trim();


        const zeile =
          document.createElement(
            "label"
          );


        zeile.className =
          "player";


        const checkbox =
          document.createElement(
            "input"
          );


        checkbox.type =
          "checkbox";


        checkbox.className =
          "spieler-checkbox";


        checkbox.dataset.id =
          s.id;


        checkbox.addEventListener(
          "change",
          function() {

            if (
              checkbox.checked
            ) {

              zeile.classList.add(
                "selected"
              );

            }

            else {

              zeile.classList.remove(
                "selected"
              );

            }


            spielerZaehlen();

          }
        );


        const text =
          document.createElement(
            "span"
          );


        text.className =
          "player-name";


        text.textContent =
          name;


        zeile.appendChild(
          checkbox
        );


        zeile.appendChild(
          text
        );


        container.appendChild(
          zeile
        );

      }
    );


    spielerZaehlen();

  }


  /* ==================================================
     SPIELER ZÄHLEN
     ================================================== */

  function spielerZaehlen() {


    const checked =
      document.querySelectorAll(
        ".spieler-checkbox:checked"
      );


    const anzahl =
      checked.length;


    const element =
      document.getElementById(
        "selectedCount"
      );


    element.textContent =
      anzahl +
      " Spieler dabei";

  }


  /* ==================================================
     ANZAHL TEAMS
     ================================================== */

  function teamAnzahlWaehlen(
    anzahl
  ) {


    anzahlTeams =
      anzahl;


    document
      .querySelectorAll(
        ".team-count button"
      )
      .forEach(
        function(
          button
        ) {

          button.classList.remove(
            "active"
          );

        }
      );


    document
      .getElementById(
        "team" +
        anzahl
      )
      .classList.add(
        "active"
      );

  }


  /* ==================================================
     TEAMS ERSTELLEN
     ================================================== */

  function teamsErstellen() {


    const checked =
      Array.from(
        document.querySelectorAll(
          ".spieler-checkbox:checked"
        )
      );


    if (
      checked.length <
      anzahlTeams
    ) {

      alert(
        "Es müssen mindestens so viele Spieler wie Teams ausgewählt sein."
      );

      return;

    }


    const ids =
      checked.map(
        function(
          checkbox
        ) {

          return checkbox.dataset.id;

        }
      );


    const button =
      document.getElementById(
        "teamsErstellen"
      );


    const ergebnis =
      document.getElementById(
        "teamsErgebnis"
      );


    button.disabled =
      true;


    button.textContent =
      "Teams werden erstellt...";


    ergebnis.innerHTML =
      `
        <div class="no-teams">
          Teams werden erstellt...
        </div>
      `;


    const callbackName =
      "marnbachTeamsCallback_" +
      Date.now();


    window[
      callbackName
    ] =
      function(
        daten
      ) {


        try {

          if (
            !daten ||
            !daten.success
          ) {

            throw new Error(
              daten &&
              daten.error
                ? daten.error
                : "Der Master konnte keine Teams erstellen."
            );

          }


          aktuelleTeams =
            daten.teams;


          teamsAnzeigen(
            daten.teams
          );


          const saveButton =
            document.getElementById(
              "teamsSpeichern"
            );


          saveButton.style.display =
            "block";


          document.getElementById(
            "saveInfo"
          ).textContent =
            "";


        }


        catch (
          err
        ) {

          ergebnis.innerHTML =
            `
              <div class="no-teams"
                   style="color:#d00000;">
                ${escapeHtml(
                  err.message
                )}
              </div>
            `;

        }


        finally {

          button.disabled =
            false;

          button.textContent =
            "Teams erstellen";


          cleanup();

        }

      };


    const notizen =
      {};


    const params =
      new URLSearchParams();


    params.set(
      "action",
      "teams"
    );


    params.set(
      "ids",
      JSON.stringify(
        ids
      )
    );


    params.set(
      "anzahlTeams",
      String(
        anzahlTeams
      )
    );


    params.set(
      "notizen",
      JSON.stringify(
        notizen
      )
    );


    params.set(
      "prefix",
      callbackName
    );


    const script =
      document.createElement(
        "script"
      );


    script.id =
      callbackName;


    script.src =
      MASTER_URL +
      "?" +
      params.toString();


    script.onerror =
      function() {

        ergebnis.innerHTML =
          `
            <div class="no-teams"
                 style="color:#d00000;">
              Verbindung zur Master-Datei fehlgeschlagen.
            </div>
          `;


        button.disabled =
          false;


        button.textContent =
          "Teams erstellen";


        cleanup();

      };


    document.body.appendChild(
      script
    );


    function cleanup() {

      try {

        delete window[
          callbackName
        ];

      }

      catch (
        e
      ) {}


      const element =
        document.getElementById(
          callbackName
        );


      if (
        element
      ) {

        element.remove();

      }

    }

  }


  /* ==================================================
     TEAMS ANZEIGEN
     ================================================== */

  function teamsAnzeigen(
    teams
  ) {


    const container =
      document.getElementById(
        "teamsErgebnis"
      );


    container.innerHTML =
      "";


    if (
      !teams
    ) {

      container.innerHTML =
        `
          <div class="no-teams">
            Keine Teams zurückgegeben.
          </div>
        `;

      return;

    }


    const namen =
      [
        "A",
        "B",
        "C",
        "D"
      ];


    namen.forEach(
      function(
        buchstabe
      ) {


        const spielerImTeam =
          Array.isArray(
            teams[
              buchstabe
            ]
          )
            ? teams[
                buchstabe
              ]
            : [];


        if (
          !spielerImTeam.length
        ) {

          return;

        }


        const teamCard =
          document.createElement(
            "div"
          );


        teamCard.className =
          "team-card";


        const header =
          document.createElement(
            "div"
          );


        header.className =
          "team-header";


        header.textContent =
          "Team " +
          buchstabe;


        teamCard.appendChild(
          header
        );


        spielerImTeam.forEach(
          function(
            name
          ) {


            const player =
              document.createElement(
                "div"
              );


            player.className =
              "team-player";


            player.textContent =
              name;


            teamCard.appendChild(
              player
            );

          }
        );


        container.appendChild(
          teamCard
        );

      }
    );

  }


  /* ==================================================
     TEAMS SPEICHERN
     ================================================== */

  function teamsSpeichern() {


    if (
      !aktuelleTeams
    ) {

      alert(
        "Bitte zuerst Teams erstellen."
      );

      return;

    }


    const info =
      document.getElementById(
        "saveInfo"
      );


    info.textContent =
      "Die Speicherfunktion wird als nächstes angebunden.";


    alert(
      "Die Teams sind bereit zum Speichern. Die Verbindung zum Spielverlauf bauen wir im nächsten Schritt ein."
    );

  }


  /* ==================================================
     HTML SICHER DARSTELLEN
     ================================================== */

  function escapeHtml(
    text
  ) {


    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      text;


    return div.innerHTML;

  }


</script>


</body>

</html>
