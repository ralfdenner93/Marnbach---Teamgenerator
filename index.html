<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Marnbach Teamgenerator</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background: #f2f2f2;

      color: #222;

    }


    .app {

      width: 100%;

      max-width: 600px;

      margin: 0 auto;

      padding: 15px;

    }


    /* ==============================
       KOPF
       ============================== */

    .header {

      background: white;

      border-radius: 18px;

      padding: 18px;

      margin-bottom: 12px;

      text-align: center;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.12);

    }


    .header h1 {

      margin: 0;

      font-size: 28px;

    }


    .header p {

      margin: 5px 0 0;

      color: #666;

    }


    /* ==============================
       KARTEN
       ============================== */

    .card {

      background: white;

      border-radius: 18px;

      padding: 16px;

      margin-bottom: 12px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.10);

    }


    /* ==============================
       BUTTONS
       ============================== */

    button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 15px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      background: #1f6feb;

      color: white;

    }


    button:active {

      transform: scale(0.98);

    }


    button:disabled {

      opacity: 0.5;

      cursor: default;

    }


    /* ==============================
       STATUS
       ============================== */

    .status {

      margin-top: 10px;

      text-align: center;

      color: #666;

      font-size: 14px;

    }


    .fehler {

      color: #b00020;

      font-weight: bold;

    }


    /* ==============================
       SPIELER
       ============================== */

    .spieler-liste {

      margin-top: 12px;

    }


    .spieler {

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 11px;

      margin-bottom: 6px;

      border-radius: 10px;

      background: #f1f1f1;

      border: 2px solid transparent;

      transition:
        background 0.15s,
        border 0.15s;

    }


    /*
     * Ausgewählter Spieler
     */

    .spieler.dabei {

      background: #cfe8d5;

      border-color: #75a985;

    }


    .spieler input {

      width: 25px;

      height: 25px;

      flex-shrink: 0;

      cursor: pointer;

    }


    .spieler-name {

      flex: 1;

      font-size: 17px;

      cursor: pointer;

    }


    .notiz {

      min-width: 35px;

      text-align: center;

      font-size: 14px;

      font-weight: bold;

    }


    .notiz.t {

      color: #444;

    }


    .notiz.tplus {

      color: #d18a00;

    }


    /* ==============================
       TEAMAUSWAHL
       ============================== */

    .team-auswahl {

      display: flex;

      gap: 8px;

      margin-top: 12px;

    }


    .team-option {

      flex: 1;

      padding: 13px 5px;

      border-radius: 10px;

      border: 2px solid #ddd;

      background: #f5f5f5;

      color: #222;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .team-option.aktiv {

      background: #1f6feb;

      border-color: #1f6feb;

      color: white;

    }


    .zaehler {

      text-align: center;

      font-size: 16px;

      font-weight: bold;

      margin-top: 5px;

    }


    .erstellen {

      margin-top: 15px;

    }


    /* ==============================
       MOBILE
       ============================== */

    @media (max-width: 400px) {

      .app {

        padding: 10px;

      }


      .header h1 {

        font-size: 25px;

      }


      .spieler-name {

        font-size: 16px;

      }

    }

  </style>

</head>


<body>


  <div class="app">


    <!-- ============================
         KOPF
         ============================ -->

    <div class="header">

      <h1>⚽ Marnbach</h1>

      <p>Teamgenerator</p>

    </div>


    <!-- ============================
         AKTUALISIEREN
         ============================ -->

    <div class="card">

      <button
        onclick="spielerLaden()"
      >
        Spieler aktualisieren
      </button>


      <div
        id="status"
        class="status"
      >
        Bereit
      </div>

    </div>


    <!-- ============================
         SPIELER
         ============================ -->

    <div
      id="spielerBereich"
      class="card"
      style="display:none;"
    >

      <h2>Spieler</h2>


      <div
        id="zaehler"
        class="zaehler"
      >
        0 Spieler dabei
      </div>


      <div
        id="spielerListe"
        class="spieler-liste"
      ></div>

    </div>


    <!-- ============================
         TEAMAUSWAHL
         ============================ -->

    <div
      id="teamBereich"
      class="card"
      style="display:none;"
    >

      <h2>Anzahl Teams</h2>


      <div class="team-auswahl">

        <button
          id="team2"
          class="team-option aktiv"
          onclick="teamAnzahlWaehlen(2)"
        >
          2
        </button>


        <button
          id="team3"
          class="team-option"
          onclick="teamAnzahlWaehlen(3)"
        >
          3
        </button>


        <button
          id="team4"
          class="team-option"
          onclick="teamAnzahlWaehlen(4)"
        >
          4
        </button>

      </div>


      <button
        class="erstellen"
        onclick="teamsErstellen()"
      >
        Teams erstellen
      </button>

    </div>


  </div>


  <script>


    /* ==============================
       EINSTELLUNGEN
       ============================== */


    const MASTER_WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbyRxZCIWtFM1P7fO4DPqG9McQF1WrNQn5jtbDShDU4x4Mz1afHa7jRMq-oG3jz5qX8/exec";


    let spieler = [];


    let anzahlTeams = 2;


    /* ==============================
       STATUS
       ============================== */


    function status(
      text,
      fehler = false
    ) {

      const element =
        document.getElementById(
          "status"
        );


      element.textContent =
        text;


      element.className =
        fehler
          ? "status fehler"
          : "status";

    }


    /* ==============================
       SPIELER LADEN
       ============================== */


    function spielerLaden() {

      status(
        "Spieler werden geladen..."
      );


      const callbackName =
        "marnbachSpieler" +
        Date.now();


      window[callbackName] =
        function(daten) {

          try {

            if (
              !daten ||
              !daten.success
            ) {

              throw new Error(
                daten?.error ||
                "Unbekannter Fehler."
              );

            }


            spieler =
              daten.spieler || [];


            spielerAnzeigen();


            status(
              spieler.length +
              " Spieler geladen."
            );


          }

          catch (fehler) {

            status(
              "Fehler: " +
              fehler.message,
              true
            );

          }


          delete window[callbackName];

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =
        MASTER_WEB_APP_URL +
        "?action=spielerPWA";


      script.onerror =
        function() {

          status(
            "Verbindung zur Master-Datei fehlgeschlagen.",
            true
          );

          delete window[callbackName];

        };


      document
        .body
        .appendChild(script);

    }


    /* ==============================
       SPIELER ANZEIGEN
       ============================== */


    function spielerAnzeigen() {

      const bereich =
        document.getElementById(
          "spielerBereich"
        );


      const teamBereich =
        document.getElementById(
          "teamBereich"
        );


      const liste =
        document.getElementById(
          "spielerListe"
        );


      liste.innerHTML = "";


      spieler.forEach(
        function(s) {


          const zeile =
            document.createElement(
              "label"
            );


          zeile.className =
            "spieler";


          const checkbox =
            document.createElement(
              "input"
            );


          checkbox.type =
            "checkbox";


          checkbox.dataset.id =
            s.id;


          checkbox.addEventListener(
            "change",
            function() {

              if (
                checkbox.checked
              ) {

                zeile.classList.add(
                  "dabei"
                );

              }

              else {

                zeile.classList.remove(
                  "dabei"
                );

              }


              zaehlerAktualisieren();

            }
          );


          const name =
            document.createElement(
              "span"
            );


          name.className =
            "spieler-name";


          name.textContent =
            (
              s.vorname +
              " " +
              s.nachname
            ).trim();


          const notiz =
            document.createElement(
              "span"
            );


          notiz.className =
            "notiz";


          const spielerNotiz =
            String(
              s.notiz || ""
            ).trim();


          if (
            spielerNotiz === "T+"
          ) {

            notiz.textContent =
              "T+";

            notiz.classList.add(
              "tplus"
            );

          }

          else if (
            spielerNotiz === "T"
          ) {

            notiz.textContent =
              "T";

            notiz.classList.add(
              "t"
            );

          }


          zeile.appendChild(
            checkbox
          );


          zeile.appendChild(
            name
          );


          zeile.appendChild(
            notiz
          );


          liste.appendChild(
            zeile
          );

        }
      );


      bereich.style.display =
        "block";


      teamBereich.style.display =
        "block";


      zaehlerAktualisieren();

    }


    /* ==============================
       ZÄHLER
       ============================== */


    function zaehlerAktualisieren() {

      const checked =
        document.querySelectorAll(
          "#spielerListe input[type='checkbox']:checked"
        );


      const anzahl =
        checked.length;


      document.getElementById(
        "zaehler"
      ).textContent =
        anzahl +
        " Spieler dabei";

    }


    /* ==============================
       TEAMANZAHL
       ============================== */


    function teamAnzahlWaehlen(
      anzahl
    ) {

      anzahlTeams =
        anzahl;


      document
        .querySelectorAll(
          ".team-option"
        )
        .forEach(
          function(button) {

            button.classList.remove(
              "aktiv"
            );

          }
        );


      document
        .getElementById(
          "team" + anzahl
        )
        .classList.add(
          "aktiv"
        );

    }


    /* ==============================
       TEAMS ERSTELLEN
       ============================== */


    function teamsErstellen() {

      const checked =
        document.querySelectorAll(
          "#spielerListe input[type='checkbox']:checked"
        );


      if (
        checked.length <
        anzahlTeams
      ) {

        alert(
          "Es müssen mindestens " +
          anzahlTeams +
          " Spieler dabei sein."
        );

        return;

      }


      alert(
        "Team-Erstellung kommt als nächster Schritt."
      );

    }


  </script>


</body>

</html>
