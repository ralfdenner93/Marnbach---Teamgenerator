<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Marnbach Teamgenerator V0.5.4</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background: #f2f2f2;

      color: #222;

    }


    .app {

      width: 100%;

      max-width: 600px;

      margin: 0 auto;

      padding: 15px;

    }


    /* ==============================
       KOPF
       ============================== */

    .header {

      background: white;

      border-radius: 18px;

      padding: 18px;

      margin-bottom: 12px;

      text-align: center;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.12);

    }


    .header h1 {

      margin: 0;

      font-size: 28px;

    }


    .header p {

      margin: 5px 0 0;

      color: #666;

    }


    /* ==============================
       KARTEN
       ============================== */

    .card {

      background: white;

      border-radius: 18px;

      padding: 16px;

      margin-bottom: 12px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.10);

    }


    /* ==============================
       BUTTONS
       ============================== */

    button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 15px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      background: #1f6feb;

      color: white;

    }


    button:active {

      transform: scale(0.98);

    }


    button:disabled {

      opacity: 0.5;

      cursor: default;

    }


    /* ==============================
       STATUS
       ============================== */

    .status {

      margin-top: 10px;

      text-align: center;

      color: #666;

      font-size: 14px;

    }


    .fehler {

      color: #b00020;

      font-weight: bold;

    }


    /* ==============================
       SPIELER
       ============================== */

    .spieler-liste {

      margin-top: 12px;

    }


    .spieler {

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 11px;

      margin-bottom: 6px;

      border-radius: 10px;

      background: #f1f1f1;

      border: 2px solid transparent;

      transition:
        background 0.15s,
        border 0.15s;

    }


    .spieler.dabei {

      background: #cfe8d5;

      border-color: #75a985;

    }


    .spieler input {

      width: 25px;

      height: 25px;

      flex-shrink: 0;

      cursor: pointer;

    }


    .spieler-name {

      flex: 1;

      font-size: 17px;

      cursor: pointer;

    }


    .notiz {

      min-width: 35px;

      text-align: center;

      font-size: 14px;

      font-weight: bold;

    }


    .notiz.t {

      color: #444;

    }


    .notiz.tplus {

      color: #d18a00;

    }


    /* ==============================
       ZÄHLER
       ============================== */

    .zaehler {

      text-align: center;

      font-size: 16px;

      font-weight: bold;

      margin-top: 5px;

    }


    /* ==============================
       TEAMAUSWAHL
       ============================== */

    .team-auswahl {

      display: flex;

      gap: 8px;

      margin-top: 12px;

    }


    .team-option {

      flex: 1;

      padding: 13px 5px;

      border-radius: 10px;

      border: 2px solid #ddd;

      background: #f5f5f5;

      color: #222;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .team-option.aktiv {

      background: #1f6feb;

      border-color: #1f6feb;

      color: white;

    }


    .erstellen {

      margin-top: 15px;

    }


    /* ==============================
       TEAMS
       ============================== */

    #ergebnisBereich {

      display: none;

    }


    .teams-container {

      display: grid;

      grid-template-columns: 1fr;

      gap: 12px;

      margin-top: 15px;

    }


    .team {

      border-radius: 14px;

      overflow: hidden;

      background: #f5f5f5;

      border: 1px solid #ddd;

    }


    .team-kopf {

      padding: 12px;

      color: white;

      font-size: 18px;

      font-weight: bold;

      text-align: center;

    }


    .team-spieler {

      padding: 8px 12px 12px;

    }


    .team-spieler-zeile {

      padding: 8px 4px;

      border-bottom: 1px solid #ddd;

      font-size: 16px;

    }


    .team-spieler-zeile:last-child {

      border-bottom: none;

    }


    .team-notiz {

      font-size: 13px;

      font-weight: bold;

      margin-left: 5px;

    }


    .team-statistik {

      padding: 12px;

      background: white;

      border-radius: 10px;

      margin-top: 12px;

      font-size: 14px;

      color: #555;

    }


    .neu-erstellen {

      margin-top: 12px;

    }


    /* ==============================
       MOBILE
       ============================== */

    @media (max-width: 400px) {

      .app {

        padding: 10px;

      }


      .header h1 {

        font-size: 25px;

      }


      .spieler-name {

        font-size: 16px;

      }

    }

  </style>

</head>


<body>


  <div class="app">


    <!-- ============================
         KOPF
         ============================ -->

    <div class="header">

      <h1>⚽ Marnbach</h1>

      <p>Teamgenerator V0.5.4</p>

    </div>


    <!-- ============================
         SPIELER AKTUALISIEREN
         ============================ -->

    <div class="card">

      <button
        onclick="spielerLaden()"
      >
        Spieler aktualisieren
      </button>


      <div
        id="status"
        class="status"
      >
        Bereit
      </div>

    </div>


    <!-- ============================
         SPIELER
         ============================ -->

    <div
      id="spielerBereich"
      class="card"
      style="display:none;"
    >

      <h2>Spieler</h2>


      <div
        id="zaehler"
        class="zaehler"
      >
        0 Spieler dabei
      </div>


      <div
        id="spielerListe"
        class="spieler-liste"
      ></div>

    </div>


    <!-- ============================
         TEAMAUSWAHL
         ============================ -->

    <div
      id="teamBereich"
      class="card"
      style="display:none;"
    >

      <h2>Anzahl Teams</h2>


      <div class="team-auswahl">

        <button
          id="team2"
          class="team-option aktiv"
          onclick="teamAnzahlWaehlen(2)"
        >
          2
        </button>


        <button
          id="team3"
          class="team-option"
          onclick="teamAnzahlWaehlen(3)"
        >
          3
        </button>


        <button
          id="team4"
          class="team-option"
          onclick="teamAnzahlWaehlen(4)"
        >
          4
        </button>

      </div>


      <button
        id="teamsErstellenButton"
        class="erstellen"
        onclick="teamsErstellen()"
      >
        Teams erstellen
      </button>

    </div>


    <!-- ============================
         TEAMERGEBNIS
         ============================ -->

    <div
      id="ergebnisBereich"
      class="card"
    >

      <h2>Teams</h2>


      <div
        id="teamsContainer"
        class="teams-container"
      ></div>


      <div
        id="statistik"
        class="team-statistik"
        style="display:none;"
      ></div>


      <button
        class="neu-erstellen"
        onclick="teamsErstellen()"
      >
        Teams neu erstellen
      </button>

    </div>


  </div>


  <script>


    /* ==============================
       MASTER WEB APP
       ============================== */

    const MASTER_WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbyRxZCIWtFM1P7fO4DPqG9McQF1WrNQn5jtbDShDU4x4Mz1afHa7jRMq-oG3jz5qX8/exec";


    /* ==============================
       GLOBALE VARIABLEN
       ============================== */

    let spieler = [];

    let anzahlTeams = 2;


    /* ==============================
       STATUS
       ============================== */

    function status(
      text,
      fehler = false
    ) {

      const element =
        document.getElementById(
          "status"
        );


      element.textContent =
        text;


      element.className =
        fehler
          ? "status fehler"
          : "status";

    }


    /* ==============================
       SPIELER LADEN
       ============================== */

    function spielerLaden() {

      status(
        "Spieler werden geladen..."
      );


      const callbackName =
        "marnbachSpieler" +
        Date.now();


      window[callbackName] =
        function(daten) {

          try {

            if (
              !daten ||
              !daten.success
            ) {

              throw new Error(
                daten?.error ||
                "Unbekannter Fehler."
              );

            }


            spieler =
              daten.spieler || [];


            spielerAnzeigen();


            status(
              spieler.length +
              " Spieler geladen."
            );


          }

          catch (fehler) {

            status(
              "Fehler: " +
              fehler.message,
              true
            );

          }


          delete window[callbackName];

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =
        MASTER_WEB_APP_URL +
        "?action=spieler" +
        "&prefix=" +
        encodeURIComponent(
          callbackName
        ) +
        "&t=" +
        Date.now();


      script.onerror =
        function() {

          status(
            "Verbindung zur Master-Datei fehlgeschlagen.",
            true
          );


          delete window[callbackName];

        };


      document
        .body
        .appendChild(script);

    }


    /* ==============================
       SPIELER ANZEIGEN
       ============================== */

    function spielerAnzeigen() {

      const bereich =
        document.getElementById(
          "spielerBereich"
        );


      const teamBereich =
        document.getElementById(
          "teamBereich"
        );


      const liste =
        document.getElementById(
          "spielerListe"
        );


      liste.innerHTML = "";


      spieler.forEach(
        function(s) {


          const zeile =
            document.createElement(
              "label"
            );


          zeile.className =
            "spieler";


          const checkbox =
            document.createElement(
              "input"
            );


          checkbox.type =
            "checkbox";


          checkbox.dataset.id =
            s.id;


          checkbox.addEventListener(
            "change",
            function() {

              if (
                checkbox.checked
              ) {

                zeile.classList.add(
                  "dabei"
                );

              }

              else {

                zeile.classList.remove(
                  "dabei"
                );

              }


              zaehlerAktualisieren();

            }
          );


          const name =
            document.createElement(
              "span"
            );


          name.className =
            "spieler-name";


          name.textContent =
            (
              s.vorname +
              " " +
              s.nachname
            ).trim();


          const notiz =
            document.createElement(
              "span"
            );


          notiz.className =
            "notiz";


          const spielerNotiz =
            String(
              s.notiz || ""
            ).trim();


          if (
            spielerNotiz === "T+"
          ) {

            notiz.textContent =
              "T+";

            notiz.classList.add(
              "tplus"
            );

          }

          else if (
            spielerNotiz === "T"
          ) {

            notiz.textContent =
              "T";

            notiz.classList.add(
              "t"
            );

          }


          zeile.appendChild(
            checkbox
          );


          zeile.appendChild(
            name
          );


          zeile.appendChild(
            notiz
          );


          liste.appendChild(
            zeile
          );

        }
      );


      bereich.style.display =
        "block";


      teamBereich.style.display =
        "block";


      zaehlerAktualisieren();

    }


    /* ==============================
       SPIELERZÄHLER
       ============================== */

    function zaehlerAktualisieren() {

      const checked =
        document.querySelectorAll(
          "#spielerListe input[type='checkbox']:checked"
        );


      const anzahl =
        checked.length;


      document.getElementById(
        "zaehler"
      ).textContent =
        anzahl +
        " Spieler dabei";

    }


    /* ==============================
       TEAMANZAHL
       ============================== */

    function teamAnzahlWaehlen(
      anzahl
    ) {

      anzahlTeams =
        anzahl;


      document
        .querySelectorAll(
          ".team-option"
        )
        .forEach(
          function(button) {

            button.classList.remove(
              "aktiv"
            );

          }
        );


      document
        .getElementById(
          "team" + anzahl
        )
        .classList.add(
          "aktiv"
        );

    }


    /* ==============================
       AUSGEWÄHLTE SPIELER
       ============================== */

    function ausgewaehlteSpieler() {

      const checked =
        document.querySelectorAll(
          "#spielerListe input[type='checkbox']:checked"
        );


      const ids = [];

      const notizen = {};


      checked.forEach(
        function(checkbox) {

          const id =
            Number(
              checkbox.dataset.id
            );


          ids.push(id);


          const spielerObjekt =
            spieler.find(
              function(s) {

                return Number(s.id) === id;

              }
            );


          if (
            spielerObjekt
          ) {

            const notiz =
              String(
                spielerObjekt.notiz || ""
              ).trim();


            if (
              notiz === "T" ||
              notiz === "T+"
            ) {

              notizen[id] =
                notiz;

            }

          }

        }
      );


      return {

        ids: ids,

        notizen: notizen

      };

    }


    /* ==============================
       TEAMS ERSTELLEN
       ============================== */

    function teamsErstellen() {

      const auswahl =
        ausgewaehlteSpieler();


      const spielerAnzahl =
        auswahl.ids.length;


      if (
        spielerAnzahl <
        anzahlTeams
      ) {

        alert(
          "Es müssen mindestens " +
          anzahlTeams +
          " Spieler dabei sein."
        );

        return;

      }


      const button =
        document.getElementById(
          "teamsErstellenButton"
        );


      if (
        button
      ) {

        button.disabled =
          true;

        button.textContent =
          "Teams werden erstellt...";

      }


      status(
        "Teams werden erstellt..."
      );


      /*
       * JSONP-Callback
       */

      const callbackName =
        "marnbachTeams" +
        Date.now();


      window[callbackName] =
        function(daten) {

          try {

            if (
              !daten ||
              daten.success === false
            ) {

              throw new Error(
                daten?.error ||
                "Die Team-Erstellung ist fehlgeschlagen."
              );

            }


            teamsAnzeigen(
              daten
            );


            status(
              "Teams erfolgreich erstellt."
            );

          }

          catch (fehler) {

            status(
              "Fehler: " +
              fehler.message,
              true
            );


            alert(
              "Fehler beim Erstellen der Teams:\n\n" +
              fehler.message
            );

          }


          delete window[callbackName];


          if (
            button
          ) {

            button.disabled =
              false;

            button.textContent =
              "Teams erstellen";

          }

        };


      /*
       * URL für den Master
       */

      const idsParameter =
        encodeURIComponent(
          JSON.stringify(
            auswahl.ids
          )
        );


      const notizenParameter =
        encodeURIComponent(
          JSON.stringify(
            auswahl.notizen
          )
        );


      const url =
        MASTER_WEB_APP_URL +
        "?action=teams" +
        "&ids=" +
        idsParameter +
        "&anzahlTeams=" +
        encodeURIComponent(
          anzahlTeams
        ) +
        "&notizen=" +
        notizenParameter +
        "&prefix=" +
        encodeURIComponent(
          callbackName
        ) +
        "&t=" +
        Date.now();


      /*
       * Script laden
       */

      const script =
        document.createElement(
          "script"
        );


      script.src =
        url;


      script.onerror =
        function() {

          status(
            "Verbindung zur Team-Erstellung fehlgeschlagen.",
            true
          );


          alert(
            "Die Verbindung zur Master-Datei für die Team-Erstellung ist fehlgeschlagen."
          );


          delete window[callbackName];


          if (
            button
          ) {

            button.disabled =
              false;

            button.textContent =
              "Teams erstellen";

          }

        };


      document
        .body
        .appendChild(script);

    }


    /* ==============================
       TEAMS ANZEIGEN
       ============================== */

    function teamsAnzeigen(
      daten
    ) {

      const bereich =
        document.getElementById(
          "ergebnisBereich"
        );


      const container =
        document.getElementById(
          "teamsContainer"
        );


      const statistik =
        document.getElementById(
          "statistik"
        );


      container.innerHTML =
        "";


      statistik.innerHTML =
        "";


      /*
       * Teams holen
       */

      const teams =
        Array.isArray(
          daten.teams
        )
          ? daten.teams
          : [];


      if (
        teams.length === 0
      ) {

        container.innerHTML =
          "<p>Der Master hat keine Teams zurückgegeben.</p>";

        bereich.style.display =
          "block";

        return;

      }


      /*
       * Teams darstellen
       */

      teams.forEach(
        function(team, index) {


          const teamBox =
            document.createElement(
              "div"
            );


          teamBox.className =
            "team";


          const kopf =
            document.createElement(
              "div"
            );


          kopf.className =
            "team-kopf";


          /*
           * Teamname möglichst
           * flexibel auslesen
           */

          let teamName =
            "";


          if (
            typeof team === "object"
          ) {

            teamName =
              team.name ||
              team.team ||
              team.teamName ||
              (
                "Team " +
                String.fromCharCode(
                  65 + index
                )
              );

          }

          else {

            teamName =
              "Team " +
              String.fromCharCode(
                65 + index
              );

          }


          kopf.textContent =
            teamName;


          /*
           * Spielerbereich
           */

          const spielerBox =
            document.createElement(
              "div"
            );


          spielerBox.className =
            "team-spieler";


          let teamSpieler = [];


          if (
            Array.isArray(team)
          ) {

            teamSpieler =
              team;

          }

          else if (
            team &&
            Array.isArray(
              team.spieler
            )
          ) {

            teamSpieler =
              team.spieler;

          }

          else if (
            team &&
            Array.isArray(
              team.players
            )
          ) {

            teamSpieler =
              team.players;

          }

          else if (
            team &&
            Array.isArray(
              team.mitglieder
            )
          ) {

            teamSpieler =
              team.mitglieder;

          }


          /*
           * Spieler anzeigen
           */

          teamSpieler.forEach(
            function(person) {

              const zeile =
                document.createElement(
                  "div"
                );


              zeile.className =
                "team-spieler-zeile";


              let name =
                "";


              let notiz =
                "";


              if (
                typeof person === "string"
              ) {

                name =
                  person;

              }

              else if (
                typeof person === "object"
              ) {

                name =
                  person.name ||
                  (
                    (
                      person.vorname ||
                      ""
                    ) +
                    " " +
                    (
                      person.nachname ||
                      ""
                    )
                  ).trim();


                notiz =
                  person.notiz ||
                  "";

              }


              if (
                !name
              ) {

                name =
                  "Unbekannter Spieler";

              }


              zeile.textContent =
                name;


              if (
                notiz
              ) {

                const notizElement =
                  document.createElement(
                    "span"
                  );


                notizElement.className =
                  "team-notiz";


                notizElement.textContent =
                  notiz;


                zeile.appendChild(
                  notizElement
                );

              }


              spielerBox.appendChild(
                zeile
              );

            }
          );


          /*
           * Falls die Struktur
           * anders geliefert wird,
           * trotzdem etwas anzeigen.
           */

          if (
            teamSpieler.length === 0
          ) {

            const fallback =
              document.createElement(
                "div"
              );


            fallback.className =
              "team-spieler-zeile";


            fallback.textContent =
              "Team wurde erstellt.";


            spielerBox.appendChild(
              fallback
            );

          }


          teamBox.appendChild(
            kopf
          );


          teamBox.appendChild(
            spielerBox
          );


          container.appendChild(
            teamBox
          );

        }
      );


      /*
       * Statistik
       */

      if (
        daten.statistik
      ) {

        statistik.style.display =
          "block";


        if (
          typeof daten.statistik ===
          "string"
        ) {

          statistik.textContent =
            daten.statistik;

        }

        else {

          statistik.textContent =
            JSON.stringify(
              daten.statistik
            );

        }

      }

      else {

        statistik.style.display =
          "none";

      }


      bereich.style.display =
        "block";


      /*
       * Zum Ergebnis scrollen
       */

      setTimeout(
        function() {

          bereich.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

        },
        100
      );

    }


  </script>


</body>

</html>
